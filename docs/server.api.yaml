        - `vertical_capsule_image`: Vertical Capsule，推荐 **748×896** PNG/JPG
        - `library_*_image`: 库资产（600×900 / 3840×1240 / 透明 Logo / 920×430）
        - `icon_image` / `app_icon_image`: **256×256** / **184×184** PNG

