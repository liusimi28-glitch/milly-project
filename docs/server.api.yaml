        type: string
      translations:
        description: Trailer title per locale (`game_asset_translations`).
        items:
          $ref: '#/definitions/GameAssetTranslationInput'
        type: array
      url:
        description: Full image or video playback URL (MP4/HLS).
        example: https://cdn.example.com/ss-1920x1080.jpg
