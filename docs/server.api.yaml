        - `header_image`: Header Capsule，推荐 **920×430** PNG/JPG
        - `capsule_image`: Small Capsule，推荐 **462×174** PNG/JPG
        - `capsule_image_v5`: 紧凑胶囊派生图（显示约 184×69）
